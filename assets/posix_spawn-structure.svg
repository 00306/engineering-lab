<svg xmlns="http://www.w3.org/2000/svg" width="930" height="424" viewBox="0 0 930 424" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .proc   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.25; }
  .proc-main { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.75; }
  .box    { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .next   { fill: none; stroke: #d1d9e0; stroke-width: 1.25; stroke-dasharray: 5 4; }
  .title  { fill: #1f2328; font-size: 16.5px; font-weight: 700; }
  .sub    { fill: #59636e; font-size: 12.5px; }
  .num    { fill: #0969da; font-size: 12px; font-weight: 700; }
  .kind   { fill: #59636e; font-size: 11.5px; font-weight: 600; }
  .name   { fill: #1f2328; font-size: 13.5px; font-weight: 600; }
  .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 13px; }
  .desc   { fill: #59636e; font-size: 12.5px; }
  .flow   { stroke: #818b98; stroke-width: 1.5; fill: none; }
  .flow-head { fill: #818b98; }
  .cross  { stroke: #0969da; stroke-width: 2; fill: none; }
  .ret    { stroke: #0969da; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
  .cross-head { fill: #0969da; }
  .xlabel { fill: #0969da; font-size: 12.5px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .proc   { fill: #151b23; stroke: #3d444d; }
    .proc-main { fill: #151b23; stroke: #4493f8; }
    .box    { fill: #0d1117; stroke: #3d444d; }
    .next   { stroke: #3d444d; }
    .title, .name { fill: #f0f6fc; }
    .sub, .kind, .desc { fill: #9198a1; }
    .num    { fill: #4493f8; }
    .flow   { stroke: #656c76; }
    .flow-head { fill: #656c76; }
    .cross, .ret { stroke: #4493f8; }
    .cross-head, .xlabel { fill: #4493f8; }
  }
</style>
<rect class="proc" x="20" y="20" width="340" height="384" rx="14"/>
<text class="title" x="40" y="50">호출한 프로세스</text>
<text class="sub" x="40" y="69">예: launchd, xpcproxy · 사용자 모드</text>
<rect class="box" x="38" y="84" width="304" height="106" rx="9"/>
<text class="num" x="52" y="109">1</text>
<text class="name mono" x="70" y="109">posix_spawn()</text>
<text class="kind" x="70" y="128">사용자 쪽 · libsystem_kernel</text>
<text class="desc" x="70" y="147">속성 · 파일 작업의 위치와 크기를</text>
<text class="desc" x="70" y="165">_posix_spawn_args_desc 하나로 묶는다</text>
<line class="flow" x1="190.0" y1="190" x2="190.0" y2="209"/>
<path class="flow-head" d="M185.0,208 L195.0,208 L190.0,216 Z"/>
<rect class="box" x="38" y="216" width="304" height="88" rx="9"/>
<text class="num" x="52" y="241">2</text>
<text class="name mono" x="70" y="241">__posix_spawn()</text>
<text class="kind" x="70" y="260">시스템 콜 스텁</text>
<text class="desc" x="70" y="279">x16 = 244 → svc</text>
<rect class="proc-main" x="530" y="20" width="380" height="384" rx="14"/>
<text class="title" x="550" y="50">커널</text>
<text class="sub" x="550" y="69">같은 스레드가 커널 모드로 실행</text>
<rect class="box" x="548" y="84" width="344" height="88" rx="9"/>
<text class="num" x="562" y="109">3</text>
<text class="name mono" x="580" y="109">handle_svc()</text>
<text class="kind" x="580" y="128">→ unix_syscall()</text>
<text class="desc" x="580" y="147">callp = &amp;sysent[244]로 처리 함수를 고른다</text>
<line class="flow" x1="720.0" y1="172" x2="720.0" y2="191"/>
<path class="flow-head" d="M715.0,190 L725.0,190 L720.0,198 Z"/>
<rect class="box" x="548" y="198" width="344" height="106" rx="9"/>
<text class="num" x="562" y="223">4</text>
<text class="name mono" x="580" y="223">posix_spawn(ap, uap, retval)</text>
<text class="kind" x="580" y="242">커널 쪽</text>
<text class="desc" x="580" y="261">uap: pid · path · adesc · argv · envp</text>
<text class="desc" x="580" y="279">adesc 내용을 copyin으로 가져온다</text>
<line class="flow" x1="720.0" y1="304" x2="720.0" y2="323"/>
<path class="flow-head" d="M715.0,322 L725.0,322 L720.0,330 Z"/>
<rect class="next" x="548" y="330" width="344" height="56" rx="9"/>
<text class="name" x="562" y="354">새 프로세스 만들기 · 실행 이미지 준비</text>
<text class="desc" x="562" y="373">→ 커널의 spawn 처리 문서</text>
<path class="cross" d="M342,260.0 C445.0,260.0 445.0,128.0 539,128.0"/>
<path class="cross-head" d="M538,122.0 L538,134.0 L548,128.0 Z"/>
<text class="xlabel" x="445.0" y="98.0" text-anchor="middle">svc</text>
<text class="xlabel" x="445.0" y="114.0" text-anchor="middle">동기 예외로 커널 진입</text>
<rect class="next" x="38" y="330" width="304" height="56" rx="9"/>
<text class="name" x="52" y="354">호출 다음 줄로 돌아온다</text>
<text class="desc" x="52" y="373">반환값 0 · *pid에 새 PID</text>
<line class="ret" x1="548" y1="358.0" x2="351" y2="358.0"/>
<path class="cross-head" d="M352,352.0 L352,364.0 L342,358.0 Z"/>
<text class="xlabel" x="445.0" y="348.0" text-anchor="middle">시스템 콜 반환</text>
<text class="xlabel" x="445.0" y="378.0" text-anchor="middle">SETEXEC면 돌아오지 않음</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
