<svg xmlns="http://www.w3.org/2000/svg" width="910" height="642" viewBox="0 0 910 642" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .proc   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.25; }
  .proc-main { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.75; }
  .box    { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .cell   { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .title  { fill: #1f2328; font-size: 16.5px; font-weight: 700; }
  .sub    { fill: #59636e; font-size: 12.5px; }
  .kind   { fill: #59636e; font-size: 11.5px; font-weight: 600; }
  .name   { fill: #1f2328; font-size: 13.5px; font-weight: 600; }
  .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 12.8px; }
  .desc   { fill: #59636e; font-size: 12.5px; }
  .link   { stroke: #818b98; stroke-width: 1.4; fill: none; }
  .link-head { fill: #818b98; }
  .clabel { fill: #59636e; font-size: 12px; font-weight: 600; }
  .cross  { stroke: #0969da; stroke-width: 1.8; fill: none; }
  .cross-head { fill: #0969da; }
  .xlabel { fill: #0969da; font-size: 12px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .proc   { fill: #151b23; stroke: #3d444d; }
    .proc-main { fill: #151b23; stroke: #4493f8; }
    .box, .cell { fill: #0d1117; stroke: #3d444d; }
    .title, .name { fill: #f0f6fc; }
    .sub, .kind, .desc, .clabel { fill: #9198a1; }
    .link   { stroke: #656c76; }
    .link-head { fill: #656c76; }
    .cross  { stroke: #4493f8; }
    .cross-head, .xlabel { fill: #4493f8; }
  }
</style>
