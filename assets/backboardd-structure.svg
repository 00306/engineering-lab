<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="966" viewBox="0 0 1180 966" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .proc   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.25; }
  .proc-main { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.75; }
  .box    { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .sim    { stroke-dasharray: 5 4; }
  .title  { fill: #1f2328; font-size: 17px; font-weight: 700; }
  .sub    { fill: #59636e; font-size: 12.5px; }
  .kind   { fill: #59636e; font-size: 11.5px; font-weight: 600; letter-spacing: 0.2px; }
  .name   { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 13.5px; }
  .desc   { fill: #59636e; font-size: 12.5px; }
  .flow   { stroke: #818b98; stroke-width: 1.5; fill: none; }
  .flow-head { fill: #818b98; }
  .cross  { stroke: #0969da; stroke-width: 2; fill: none; }
  .cross-head { fill: #0969da; }
  .xlabel { fill: #0969da; font-size: 12.5px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .proc   { fill: #151b23; stroke: #3d444d; }
    .proc-main { fill: #151b23; stroke: #4493f8; }
    .box    { fill: #0d1117; stroke: #3d444d; }
    .title, .name { fill: #f0f6fc; }
    .sub, .kind, .desc { fill: #9198a1; }
    .flow   { stroke: #656c76; }
    .flow-head { fill: #656c76; }
    .cross  { stroke: #4493f8; }
    .cross-head, .xlabel { fill: #4493f8; }
  }
</style>
<rect class="proc-main" x="400" y="20" width="380" height="926" rx="14"/>
<text class="title" x="420" y="50">backboardd</text>
<text class="sub" x="420" y="69">시스템 데몬 · 사용자 공간</text>
<rect class="box sim" x="420" y="84" width="340" height="86" rx="9"/>
<text class="kind" x="434" y="109">프레임워크 · 클래스 · 시뮬레이터 전용</text>
<text class="name mono" x="434" y="129">SimulatorHID · SimHIDSystem</text>
<text class="desc" x="434" y="152">입력 데이터로 HID 이벤트를 만든다</text>
<line class="flow" x1="590.0" y1="170" x2="590.0" y2="193"/>
<path class="flow-head" d="M585.0,192 L595.0,192 L590.0,200 Z"/>
<rect class="box" x="420" y="200" width="340" height="86" rx="9"/>
<text class="kind" x="434" y="225">프레임워크</text>
<text class="name" x="434" y="245">IOKit HID 이벤트 시스템</text>
<text class="desc" x="434" y="268">등록해 둔 콜백 주소를 읽어 호출한다</text>
<line class="flow" x1="590.0" y1="286" x2="590.0" y2="309"/>
<path class="flow-head" d="M585.0,308 L595.0,308 L590.0,316 Z"/>
<rect class="box" x="420" y="316" width="340" height="106" rx="9"/>
<text class="kind" x="434" y="341">C 함수</text>
<text class="name mono" x="434" y="361">_BKIOHIDEventCallback</text>
<text class="name mono" x="434" y="381">_BKHandleIOHIDEventFromSender</text>
<text class="desc" x="434" y="404">발신원 정보·전달 담당 객체를 얻어 넘긴다</text>
<line class="flow" x1="590.0" y1="422" x2="590.0" y2="445"/>
<path class="flow-head" d="M585.0,444 L595.0,444 L590.0,452 Z"/>
<rect class="box" x="420" y="452" width="340" height="86" rx="9"/>
<text class="kind" x="434" y="477">클래스</text>
<text class="name mono" x="434" y="497">BKHIDSystem</text>
<text class="desc" x="434" y="520">처리기를 보관하고, 주 처리기로 넘긴다</text>
<line class="flow" x1="590.0" y1="538" x2="590.0" y2="561"/>
<path class="flow-head" d="M585.0,560 L595.0,560 L590.0,568 Z"/>
<rect class="box" x="420" y="568" width="340" height="86" rx="9"/>
<text class="kind" x="434" y="593">클래스</text>
<text class="name mono" x="434" y="613">BKHIDPrimaryEventProcessor</text>
<text class="desc" x="434" y="636">이벤트 종류를 보고 처리 목록을 고른다</text>
<line class="flow" x1="590.0" y1="654" x2="590.0" y2="677"/>
<path class="flow-head" d="M585.0,676 L595.0,676 L590.0,684 Z"/>
<rect class="box" x="420" y="684" width="340" height="86" rx="9"/>
<text class="kind" x="434" y="709">클래스 · 종류별 처리기의 예</text>
<text class="name mono" x="434" y="729">BKHIDDirectTouchEventProcessor</text>
<text class="desc" x="434" y="752">직접 터치를 처리한다</text>
<line class="flow" x1="590.0" y1="770" x2="590.0" y2="793"/>
<path class="flow-head" d="M585.0,792 L595.0,792 L590.0,800 Z"/>
<rect class="box" x="420" y="800" width="340" height="126" rx="9"/>
<text class="kind" x="434" y="825">클래스</text>
<text class="name mono" x="434" y="845">BKHIDEventHitTestDispatcher</text>
<text class="name mono" x="434" y="865">BKHIDClientConnectionManager</text>
<text class="name mono" x="434" y="885">BKHIDClientConnection</text>
<text class="desc" x="434" y="908">받을 클라이언트 연결을 찾아 보낸다</text>
<rect class="proc sim" x="20" y="20.0" width="270" height="170" rx="14"/>
<text class="title" x="40" y="50.0">Simulator</text>
<text class="sub" x="40" y="69.0">Mac 프로세스 · 시뮬레이터 전용</text>
<rect class="box sim" x="40" y="84.0" width="230" height="86" rx="9"/>
<text class="kind" x="54" y="109.0">클래스</text>
<text class="name mono" x="54" y="129.0">SimDeviceLegacyHIDClient</text>
<text class="desc" x="54" y="152.0">터치 좌표·접촉 상태를 보낸다</text>
<line class="cross" x1="270" y1="127.0" x2="411" y2="127.0"/>
<path class="cross-head" d="M410,121.0 L410,133.0 L420,127.0 Z"/>
<text class="xlabel" x="345.0" y="100.0" text-anchor="middle">입력 데이터</text>
<text class="xlabel" x="345.0" y="117.0" text-anchor="middle">IPC</text>
<rect class="proc" x="890" y="746.0" width="270" height="190" rx="14"/>
<text class="title" x="910" y="776.0">클라이언트 프로세스</text>
<text class="sub" x="910" y="795.0">예: SpringBoard</text>
<rect class="box" x="910" y="810.0" width="230" height="106" rx="9"/>
<text class="kind" x="924" y="835.0">프레임워크 · 클래스</text>
<text class="name mono" x="924" y="855.0">UIKitCore</text>
<text class="name mono" x="924" y="875.0">UIEventFetcher</text>
<text class="desc" x="924" y="898.0">큐에서 꺼내 이벤트를 다시 만든다</text>
<line class="cross" x1="760" y1="863.0" x2="901" y2="863.0"/>
<path class="cross-head" d="M900,857.0 L900,869.0 L910,863.0 Z"/>
<text class="xlabel" x="835.0" y="836.0" text-anchor="middle">HID 이벤트</text>
<text class="xlabel" x="835.0" y="853.0" text-anchor="middle">큐 + 도착 알림</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
