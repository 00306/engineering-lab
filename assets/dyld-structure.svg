<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="1044" viewBox="0 0 1106 1044" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .proc   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.25; }
  .proc-main { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.75; }
  .box    { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .lane   { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .sim    { stroke-dasharray: 5 4; }
  .life   { stroke: #d1d9e0; stroke-width: 1.25; stroke-dasharray: 3 5; }
  .title  { fill: #1f2328; font-size: 17px; font-weight: 700; }
  .sub    { fill: #59636e; font-size: 12.5px; }
  .ltitle { fill: #1f2328; font-size: 14.5px; font-weight: 700; }
  .name   { fill: #1f2328; font-size: 13.5px; font-weight: 600; }
  .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 12.8px; }
  .desc   { fill: #59636e; font-size: 12.5px; }
  .call   { stroke: #818b98; stroke-width: 1.5; fill: none; }
  .call-head { fill: #818b98; }
  .ret    { stroke: #818b98; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .clabel { fill: #59636e; font-size: 12.5px; font-weight: 600; }
  .cross  { stroke: #0969da; stroke-width: 2; fill: none; }
  .cross-head { fill: #0969da; }
  .xlabel { fill: #0969da; font-size: 12.5px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .proc   { fill: #151b23; stroke: #3d444d; }
    .proc-main { fill: #151b23; stroke: #4493f8; }
    .box, .lane { fill: #0d1117; stroke: #3d444d; }
    .life   { stroke: #3d444d; }
    .title, .name, .ltitle { fill: #f0f6fc; }
    .sub, .desc, .clabel { fill: #9198a1; }
    .call, .ret { stroke: #656c76; }
    .call-head { fill: #656c76; }
    .cross  { stroke: #4493f8; }
    .cross-head, .xlabel { fill: #4493f8; }
  }
</style>
