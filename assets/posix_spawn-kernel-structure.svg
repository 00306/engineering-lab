<rect class="box" x="38" y="171" width="344" height="84" rx="9"/>
<text class="num" x="52" y="196">1</text>
<text class="name mono" x="70" y="196">fork1 / cloneproc</text>
<text class="name mono" x="70" y="215">→ forkproc · fork_create_child</text>
<text class="desc" x="70" y="235">새 proc · task · 첫 thread</text>
