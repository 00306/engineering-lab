<text class="name mono" x="70" y="775">task_clear_return_wait</text>
<text class="desc" x="70" y="795">첫 스레드의 대기 해제</text>
<rect class="proc" x="550" y="20" width="380" height="666.75" rx="14"/>
<text class="title" x="570" y="50">새 프로세스의 커널 자료구조</text>
<text class="sub" x="570" y="69">커널 메모리에 생기고 서로 연결된다</text>
