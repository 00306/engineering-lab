<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="442" viewBox="0 0 1020 442" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .proc   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.25; }
  .proc-main { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.75; }
  .box    { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .cell   { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .cell-off { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
  .sep    { stroke: #d1d9e0; stroke-width: 1; }
  .title  { fill: #1f2328; font-size: 17px; font-weight: 700; }
  .sub    { fill: #59636e; font-size: 12.5px; }
  .kind   { fill: #59636e; font-size: 11.5px; font-weight: 600; }
  .name   { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .num    { fill: #1f2328; font-size: 15px; font-weight: 700; }
  .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 13px; }
  .desc   { fill: #59636e; font-size: 12.5px; }
  .flow   { stroke: #818b98; stroke-width: 1.5; fill: none; }
  .flow-head { fill: #818b98; }
  .cross  { stroke: #0969da; stroke-width: 2; fill: none; }
  .cross-head { fill: #0969da; }
  .xlabel { fill: #0969da; font-size: 12.5px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .proc   { fill: #151b23; stroke: #3d444d; }
    .proc-main { fill: #151b23; stroke: #4493f8; }
    .box, .cell { fill: #0d1117; stroke: #3d444d; }
    .cell-off { fill: #151b23; stroke: #3d444d; }
    .sep    { stroke: #3d444d; }
    .title, .name, .num { fill: #f0f6fc; }
    .sub, .kind, .desc { fill: #9198a1; }
    .flow   { stroke: #656c76; }
    .flow-head { fill: #656c76; }
    .cross  { stroke: #4493f8; }
    .cross-head, .xlabel { fill: #4493f8; }
  }
</style>
<rect class="proc" x="20" y="20" width="270" height="402" rx="14"/>
<text class="title" x="40" y="50">앱 프로세스</text>
<text class="sub" x="40" y="69">사용자 공간 · 들고 있는 건 정수뿐</text>
<rect class="box" x="40" y="158.0" width="230" height="82" rx="9"/>
<text class="kind" x="54" y="184.0">시스템 콜 · fd를 정수로 넘김</text>
<text class="name mono" x="54" y="204.0">read(0, buf, n)</text>
<text class="name mono" x="54" y="224.0">write(1, buf, n)</text>
<rect class="box" x="40" y="254.0" width="230" height="84" rx="9"/>
<text class="kind" x="54" y="280.0">C 표준 라이브러리 · FILE *</text>
<text class="name mono" x="54" y="300.0">stdin · stdout · stderr</text>
<text class="desc" x="54" y="322.0">내부에서 0 · 1 · 2번으로 위 호출을 쓴다</text>
