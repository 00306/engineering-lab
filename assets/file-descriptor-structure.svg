<text class="name mono" x="446" y="325.0">fd_cdir</text>
<text class="desc" x="446" y="342.0">작업 디렉터리</text>
<text class="name mono" x="446" y="365.0">fd_cmask</text>
<text class="desc" x="446" y="382.0">파일 생성 마스크</text>
