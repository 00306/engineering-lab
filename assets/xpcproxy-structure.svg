<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<style>
  .proc   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.25; }
  .proc-main { fill: #f6f8fa; stroke: #0969da; stroke-width: 1.75; }
  .fw     { fill: #eff2f5; stroke: #d1d9e0; stroke-width: 1; }
  .box    { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1; }
  .title  { fill: #1f2328; font-size: 16.5px; font-weight: 700; }
  .sub    { fill: #59636e; font-size: 12.5px; }
  .fwname { fill: #1f2328; font-size: 13px; font-weight: 700; }
  .num    { fill: #0969da; font-size: 12px; font-weight: 700; }
  .tag    { fill: #59636e; font-size: 11.5px; font-weight: 600; }
  .name   { fill: #1f2328; font-size: 13.5px; font-weight: 600; }
  .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 12.5px; }
  .desc   { fill: #59636e; font-size: 12px; }
  .flow   { stroke: #818b98; stroke-width: 1.5; fill: none; }
  .flow-head { fill: #818b98; }
  .cross  { stroke: #0969da; stroke-width: 2; fill: none; }
  .cross-head { fill: #0969da; }
  .xlabel { fill: #0969da; font-size: 12.5px; font-weight: 600; }
  @media (prefers-color-scheme: dark) {
    .proc   { fill: #151b23; stroke: #3d444d; }
    .proc-main { fill: #151b23; stroke: #4493f8; }
    .fw     { fill: #1a212b; stroke: #3d444d; }
    .box    { fill: #0d1117; stroke: #3d444d; }
    .title, .name, .fwname { fill: #f0f6fc; }
    .sub, .tag, .desc { fill: #9198a1; }
    .num    { fill: #4493f8; }
    .flow   { stroke: #656c76; }
    .flow-head { fill: #656c76; }
    .cross  { stroke: #4493f8; }
    .cross-head, .xlabel { fill: #4493f8; }
  }
</style>
<rect class="proc-main" x="400" y="20" width="420" height="620" rx="14"/>
<text class="title" x="420" y="50">PID 1234</text>
<text class="sub" x="420" y="69">launchd가 띄운 새 프로세스</text>
<rect class="fw" x="418" y="84" width="384" height="400" rx="10"/>
<text class="fwname" x="432" y="107">교체 전 · xpcproxy_sim의 코드</text>
<rect class="box" x="432" y="120" width="356" height="56" rx="8"/>
<text class="num" x="444" y="142">0</text>
<text class="tag" x="444" y="161">요청</text>
<text class="name" x="518" y="142">launchd에 자기 설정을 요청</text>
<text class="desc" x="518" y="161">self = true · 요청 700</text>
<line class="flow" x1="610.0" y1="176" x2="610.0" y2="187"/>
<path class="flow-head" d="M604.0,184 L616.0,184 L610.0,194 Z"/>
<rect class="box" x="432" y="194" width="356" height="56" rx="8"/>
<text class="num" x="444" y="216">1–6</text>
<text class="tag" x="444" y="235">읽기</text>
<text class="name" x="518" y="216">blob에서 재료 읽기</text>
<text class="desc" x="518" y="235">path · argv · envp · cwd · 0·1·2번 경로</text>
<line class="flow" x1="610.0" y1="250" x2="610.0" y2="261"/>
<path class="flow-head" d="M604.0,258 L616.0,258 L610.0,268 Z"/>
<rect class="box" x="432" y="268" width="356" height="56" rx="8"/>
<text class="num" x="444" y="290">8–11, 15</text>
<text class="tag" x="444" y="309">기록</text>
<text class="name" x="518" y="290">지시 쌓기</text>
<text class="desc" x="518" y="309">파일 작업 목록 · 포트 · 프로세스 유형</text>
<line class="flow" x1="610.0" y1="324" x2="610.0" y2="335"/>
<path class="flow-head" d="M604.0,332 L616.0,332 L610.0,342 Z"/>
<rect class="box" x="432" y="342" width="356" height="56" rx="8"/>
<text class="num" x="444" y="364">7, 12–14</text>
<text class="tag" x="444" y="383">즉시</text>
<text class="name" x="518" y="364">자기 상태 바로 바꾸기</text>
<text class="desc" x="518" y="383">mkpath_np · umask · chdir · setiopolicy_np</text>
<line class="flow" x1="610.0" y1="398" x2="610.0" y2="409"/>
<path class="flow-head" d="M604.0,406 L616.0,406 L610.0,416 Z"/>
<rect class="box" x="432" y="416" width="356" height="56" rx="8"/>
<text class="num" x="444" y="438">16–17</text>
<text class="tag" x="444" y="457">교체</text>
<text class="name" x="518" y="438">SETEXEC를 켜고 posix_spawn</text>
<text class="desc" x="518" y="457">posix_spawn(NULL, path, …)</text>
<rect class="fw" x="418" y="524" width="384" height="98" rx="10"/>
<text class="fwname" x="432" y="547">교체 후 · 대상 프로그램(앱)의 코드</text>
<rect class="box" x="432" y="560" width="356" height="50" rx="8"/>
<text class="name mono" x="444" y="581">__dyld_start</text>
<text class="desc" x="444" y="599">dyld부터 시작한다 · 같은 PID 1234</text>
<rect class="proc" x="20" y="139.0" width="220" height="92" rx="14"/>
<text class="title" x="40" y="169.0">launchd</text>
<text class="sub" x="40" y="188.0">PID 1234의 작업을 보관</text>
<line class="cross" x1="432" y1="148.0" x2="249" y2="148.0"/>
<path class="cross-head" d="M250,142.0 L250,154.0 L240,148.0 Z"/>
<text class="xlabel" x="320.0" y="138.0" text-anchor="middle">① 설정 요청 · XPC</text>
<line class="cross" x1="240" y1="222.0" x2="423" y2="222.0"/>
<path class="cross-head" d="M422,216.0 L422,228.0 L432,222.0 Z"/>
<text class="xlabel" x="320.0" y="242.0" text-anchor="middle">② blob · ports · fds</text>
<rect class="proc" x="980" y="468.5" width="200" height="92" rx="14"/>
<text class="title" x="1000" y="498.5">커널</text>
<text class="sub" x="1000" y="517.5">지시 적용 · 이미지 교체</text>
<path class="cross" d="M788,444.0 L1080.0,444.0 L1080.0,459.5"/>
<path class="cross-head" d="M1074.0,458.5 L1086.0,458.5 L1080.0,468.5 Z"/>
<text class="xlabel" x="894.0" y="434.0" text-anchor="middle" dx="24">③ posix_spawn · SETEXEC</text>
<path class="cross" d="M1080.0,560.5 L1080.0,585 L797,585"/>
<path class="cross-head" d="M798,579 L798,591 L788,585 Z"/>
<text class="xlabel" x="894.0" y="575" text-anchor="middle" dx="24">④ 같은 PID에서 시작</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
